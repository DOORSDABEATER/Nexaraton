name: Build NEXARION

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (unzips NexarionWeapon.zip if needed)
        run: |
          if [ -f build.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            unzip -q NexarionWeapon.zip
            echo "PROJECT_DIR=NexarionWeapon" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build plugin
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Package resource pack
        run: |
          cd "$PROJECT_DIR/resourcepack"
          zip -r -X "$GITHUB_WORKSPACE/NEXARION-ResourcePack.zip" .

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NexarionWeapon-plugin
          path: ${{ env.PROJECT_DIR }}/build/libs/NexarionWeapon-*.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: NEXARION-ResourcePack
          path: NEXARION-ResourcePack.zip
          if-no-files-found: error
          
